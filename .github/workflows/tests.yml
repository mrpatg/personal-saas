# Regression tests: on every pull request (and push to main), type check the
# code, build the site, start it on an empty local database and walk through
# every main feature with a real browser (tests/portal.spec.ts).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Run the regression tests
        run: npm test
      - name: Keep the failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
